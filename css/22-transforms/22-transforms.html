<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="22-transforms.css" />
    <title>CSS Transforms</title>
  </head>
  <body>
    <main>
      <h1>Motion CSS Transforms</h1>
      <section class="transform-x">
        <h2>Transitions X</h2>
        <div class="box-1"></div>
        <div class="box-2"></div>
      </section>
      <hr />
      <section class="transform-y">
        <h2>Transitions Y</h2>
        <div class="exp">
          <div class="box-1"></div>
          <div class="box-2"></div>
        </div>
      </section>
      <hr />
      <section class="transform-xy">
        <h2>Transitions XY</h2>
        <div class="exp">
          <div class="box-1"></div>
          <div class="box-2"></div>
        </div>
      </section>

      <hr />
    <section class="scaling">
        <h2>Scaling</h2>
        <div class="exp">
          <div class="box-1"></div>
          <div class="box-2"></div>
          <div class="box-3"></div>
        </div>
      </section>
          <hr />
    <section class="rotation">
        <h2>Rotation</h2>
        <div class="exp">
          <div class="box-1"></div>
          <div class="box-2"></div>
          <div class="box-3"></div>
          <div class="box-4"></div>
          <div class="box-5"></div>
        </div>
      </section>

                <hr />
    <section class="skew">
        <h2>Skewing</h2>
        <div class="exp">
          <div class="box-1"></div>
          <div class="box-2"></div>
          <div class="box-3"></div>
          <div class="box-4"></div>
          <div class="box-5"></div>
        </div>
      </section>

                      <hr />
    <section class="transform-order">
        <h2>Transform order</h2>
        <div class="exp">
          <div class="box-1"></div>
          <div class="box-2"></div>
          <div class="box-3"></div>
          <div class="box-4"></div>
          <div class="box-5"></div>
        </div>
      </section>

                            <hr />
    <section class="transform-origin">
        <h2>Transform origin</h2>
        <div class="exp">
          <div class="box-1">Default Transform origin</div>
          <div class="box-2">Top left Transform origin</div>
          <div class="box-3">Booton left Transform origin</div>
          <div class="box-4">Booton right Transform origin</div>
        </div>
      </section>
    </main>
  </body>
</html>
