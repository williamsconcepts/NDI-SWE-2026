<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Utilities</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">

        <h1>JavaScript String Utilities</h1>

        <!-- Email Masking -->
        <section class="card">
            <h2>Mask Email</h2>

            <input
                id="mask-email-input"
                type="text"
                placeholder="Enter Email"
            >

            <button id="mask-btn">
                Mask Email
            </button>

            <p id="mask-output"></p>
        </section>

        <!-- URL Generator -->
        <section class="card">
            <h2>Generate URL</h2>

            <input
                id="url-input"
                type="text"
                placeholder="Enter Domain"
            >

            <button id="url-btn">
                Generate URL
            </button>

            <p id="url-output"></p>
        </section>

        <!-- Email Validation -->
        <section class="card">
            <h2>Validate Email</h2>

            <input
                id="validate-email-input"
                type="text"
                placeholder="Enter Email"
            >

            <button id="validate-btn">
                Validate Email
            </button>

            <p id="validate-output"></p>
        </section>

    </main>

</body>
</html>
