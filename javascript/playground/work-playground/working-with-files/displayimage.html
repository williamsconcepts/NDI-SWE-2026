<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Displaying Local images</title>
    <style>
      .thumb {
        max-height: 100px;
        margin: 5px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <input type="file" multiple accept="image/*" />
    <div class="output"></div>

    <script>
      // select page elements
      const fileInput = document.querySelector("input");
      const fileOutput = document.querySelector(".output");

      // add and event listener
      fileInput.addEventListener("change", readImages);

      // function to read selected files
      function readImages(event) {
        // clear previous images
        output.innerHTML = "";

        // GEt the selected files
        for (let i = 0; i < files.length; i++) {
          // store the current file
          const file = files[i];

          // create an image element
          const img = document.createElement("img");
          img.classList.add("thumb");
          output.appendChild(img);

          // create a Filereader object
          const fileReader = new FileReader();

          // set image source when loading is complete
          fileReader.onload = function (e) {
            img.src = e.target.result;
          };

          // Read the file as a Data URL
          fileReader.readAsDataURL(file);
        }
      }
    </script>
  </body>
</html>
