<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <title>Celsuis To Fahrenhiet</title>
    <script src="script.js" defer></script>
</head>
<body>
    
    <main>
        <section class="celsuis-converter">
            <fieldset>
                <legend>Celsuis To Fahrenhiet Converter</legend>
                <div class="card">
                    <div class="wrapper align-items">
                        <input type="number" id="celsuis-input" placeholder="Enter Celsius">
                        <button id="convert-btn">Convert</button>
                    </div>
                    <p id="celsuis-output">Result...</p>
                </div>
            </fieldset>    
        </section>

<hr>
        <section class="shopping-cart">
            <fieldset>
                <legend>Shopping Cart</legend>
                <div class="shop-card">  
                    <div class="wrapper align-items">
                        <div class="input-group align-items" >
                        <input type="text" id="item-name" placeholder="Enter Item">
                        <input type="text" id="item-price" placeholder="Enter Price">
                        <input type="text" id="item-quantity" placeholder="Enter Quantity">
                    </div>
                        <button id="add-btn">Add Item</button>
                    </div>

                    <ul id="cart-items"></ul>

                    <button id="calculate-btn">Calculate Total</button>

                    <h3 id="total">Total: </h3>
                    
                </div>
            </fieldset>    
        </section>
    </main>
</body>
</html>
